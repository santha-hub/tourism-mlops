name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── Job 1: Register Dataset ─────────────────────────────────────────────────
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install pandas

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload Dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: tourism.csv

  # ── Job 2: Prepare Data ─────────────────────────────────────────────────────
  prepare-data:
    runs-on: ubuntu-latest
    needs: register-dataset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install pandas scikit-learn

      - name: Download Dataset Artifact
        uses: actions/download-artifact@v4
        with:
          name: dataset
          path: tourism_project/data/

      - name: Prepare Data
        run: python tourism_project/model_building/prep.py

      - name: Upload Train/Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/model_building/train.csv
            tourism_project/model_building/test.csv

  # ── Job 3: Train Model ──────────────────────────────────────────────────────
  train-model:
    runs-on: ubuntu-latest
    needs: prepare-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install pandas scikit-learn xgboost mlflow joblib

      - name: Download Train/Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/model_building/

      - name: Train Model
        run: python tourism_project/model_building/train.py

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: best-model
          path: tourism_project/deployment/best_model.joblib

  # ── Job 4: Commit Model to Repository ──────────────────────────────────────
  commit-model:
    runs-on: ubuntu-latest
    needs: train-model
    steps:
      - uses: actions/checkout@v4

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: best-model
          path: tourism_project/deployment/

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Model
        run: |
          git add tourism_project/deployment/best_model.joblib
          git diff --cached --quiet || git commit -m "ci: update trained model [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
